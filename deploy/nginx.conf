# The SecondTrust website. Static files only: read-only, no uploads, no server-side code.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Only reading is possible
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 1k;

    include /etc/nginx/mime.types;
    types { text/markdown md; }
    charset utf-8;
    charset_types text/html text/css text/plain text/markdown application/javascript image/svg+xml;

    gzip on;
    gzip_types text/css text/plain text/markdown application/javascript image/svg+xml;

    # The pages load only their own files, plus the pinned Markdown renderer (checked by its SRI hash)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Myprod health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pages and docs change with every release; fonts never do
    location ~* \.(html|md|txt)$ { expires -1; }
    location /fonts/ { expires 365d; }
    location / { expires 1h; try_files $uri $uri/ =404; }
}
